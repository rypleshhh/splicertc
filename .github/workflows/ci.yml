# Build, vet and test on every push and pull request.
# Server parts are tested on Linux (with the race detector), the
# Windows-only client and tray on Windows. govulncheck fails the build
# when the code calls a known vulnerable function.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: vet
        run: go vet ./cmd/server/... ./cmd/genkey ./cmd/gencert ./cmd/portprobe ./cmd/tunprobe ./internal/...
      - name: test (race)
        run: go test -race -count=1 ./cmd/server/... ./internal/...
      - name: build server
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/server

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
