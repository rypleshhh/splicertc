# Build, lint and test on every push and pull request.
# The server and shared packages are tested on Linux, the Windows-only
# client and tray on Windows; both with the race detector.
# Actions are pinned by commit SHA and tools by version, so a moved tag
# or a new tool release can't change what CI runs.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.2
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  LINUX_PKGS: ./cmd/server/... ./cmd/genkey ./cmd/gencert ./cmd/portprobe ./cmd/tunprobe ./internal/...

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet $LINUX_PKGS
      - name: staticcheck
        run: go run $STATICCHECK $LINUX_PKGS
      - name: test (race)
        run: go test -race -count=1 ./cmd/server/... ./internal/...
      - name: build server
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/server
      - name: govulncheck
        run: go run $GOVULNCHECK $LINUX_PKGS

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run ${{ env.STATICCHECK }} ./...
      - name: test (race)
        # the race detector needs cgo; the runner has mingw gcc
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: build client and tray
        run: |
          go build -o client.exe ./cmd/client
          go build -ldflags "-H=windowsgui" -o tray.exe ./cmd/tray
      - name: govulncheck
        run: go run ${{ env.GOVULNCHECK }} ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image
        run: docker build -t splicertc-server:ci .
