services:
  dormtun-server:
    build: .
    container_name: dormtun-server
    # Host networking so the container sees real client source addresses
    # and can relay UDP outward without an extra NAT hop. Simplest for a
    # dedicated test box. Ports from server-config.json are used as-is on
    # the host.
    network_mode: host
    restart: unless-stopped
    # Docker keeps container logs forever by default; with a busy tunnel
    # that fills the disk. Keep at most 3 x 10 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Needed for the full-tunnel VPN channel: it creates its own TUN
    # device and runs `ip`/`iptables` to address it and NAT its traffic
    # out (see cmd/server/vpn_setup.go). Not required for the reliable/
    # droppable/glue channels alone.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./server-config.json:/app/server-config.json:ro
      # Must exist before the first `docker compose up`, same reason as
      # server-config.json above (otherwise Docker mounts an empty
      # directory here instead of the file) — cp
      # authorized_keys.example.json authorized_keys.json first.
      - ./authorized_keys.json:/app/authorized_keys.json:ro
      # The TLS cert and key. They are not in the image (a private key in
      # an image layer leaks with the image), so without this mount the
      # server doesn't start. Generate them once on the host with `go run
      # ./cmd/gencert` before the first `docker compose up`; the
      # fingerprint (the clients' server_pin) then stays the same across
      # any number of rebuilds and restarts.
      - ./devcerts:/app/devcerts:ro
