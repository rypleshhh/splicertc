services:
  dormtun-server:
    build: .
    container_name: dormtun-server
    # Host networking so the container sees real client source addresses
    # and can relay UDP outward without an extra NAT hop. Simplest for a
    # dedicated test box. Ports in EXPOSE/CMD are used as-is on the host.
    network_mode: host
    restart: unless-stopped
    # Needed for the full-tunnel VPN channel: it creates its own TUN
    # device and runs `ip`/`iptables` to address it and NAT its traffic
    # out (see cmd/server/vpn.go). Not required for the reliable/
    # droppable/glue channels alone.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./server-config.json:/app/server-config.json:ro
      # Must exist before the first `docker compose up`, same reason as
      # server-config.json above (otherwise Docker mounts an empty
      # directory here instead of the file) — cp
      # authorized_keys.example.json authorized_keys.json first.
      - ./authorized_keys.json:/app/authorized_keys.json:ro
      # Persists the TLS cert across rebuilds. Without this mount, every
      # `docker compose up --build` bakes a FRESH self-signed cert into
      # the image (see Dockerfile), changing its fingerprint every time —
      # meaning every client's server_pin/pin_file would need updating
      # after every rebuild. Generate this once with `go run
      # ./cmd/gencert` (must exist before the first `docker compose up`,
      # same reason as the mounts above) and it never needs touching
      # again; the fingerprint stays stable for the container's whole
      # lifetime, across any number of rebuilds/restarts.
      - ./devcerts:/app/devcerts:ro
